name = "gemini-pet-bff"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GCP_PROJECT_ID = "1031423259598"
GCP_LOCATION = "global"
MODEL_FAST = "gemini-3.5-flash-lite"
MODEL_BALANCED = "gemini-4-hydrogen"
MODEL_DEEP = "gemini-4-argon"
MODEL_UPGRADER = "gemini-4-argon"
MODEL_DREAMER = "gemini-4-hydrogen"
GITHUB_OWNER = "ZeroAker"
GITHUB_REPO = "gemini-pet-bff"
GITHUB_BRANCH = "main"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./public"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "src/ui/**/*.js"]
fallthrough = true
